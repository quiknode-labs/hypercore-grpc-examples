[package]
name = "hyperliquid-grpc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/grpcRawDataExample/main.rs"

[[bin]]
name = "filter_example"
path = "src/grpcFilterExample/filter_example.rs"

[[bin]]
name = "s3_blocks_backfill"
path = "src/replicaCmdsOnS3Example/s3_blocks_backfill.rs"
required-features = ["s3"]

[[bin]]
name = "orderbookStreamExample"
path = "src/orderbookStreamExample/orderbook_stream_example.rs"

[[bin]]
name = "priorityOrderExample"
path = "src/priorityOrderExample/watch_priority_mempool.rs"

[[bin]]
name = "mempool_filter_example"
path = "src/mempoolFilterExample/mempool_filter_example.rs"

[[bin]]
name = "hip4_venue_example"
path = "src/hip4VenueExample/hip4_venue_example.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.10", features = ["tls", "tls-roots"] }
prost = "0.12"
zstd = "0.13"
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
aws-config = { version = "1.0", optional = true }
aws-sdk-s3 = { version = "1.0", optional = true }

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[build-dependencies]
tonic-build = "0.10"
